{{- if .Values.kcache.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kcache-demo.fullname" . }}-kcache
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: kcache
spec:
  selector:
    matchLabels:
      {{- include "kcache-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kcache
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "kcache-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kcache
    spec:
      # hostNetwork so kcache listens on the node IP, reachable from pod veths.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "kcache-demo.fullname" . }}-kcache
      nodeSelector:
        kubernetes.io/os: linux
      # Tolerate all taints so kcache runs on every node including control-plane.
      tolerations:
        - operator: Exists
      containers:
        - name: kcache
          image: "{{ .Values.kcache.image.repository }}:{{ .Values.kcache.image.tag }}"
          imagePullPolicy: {{ .Values.kcache.image.pullPolicy }}
          args:
            - -proxy-addr={{ .Values.kcache.proxyAddr }}
            - -log-level={{ .Values.kcache.logLevel }}
            - -max-cache-bytes={{ .Values.kcache.maxCacheBytes | int64 }}
            - -max-body-bytes={{ .Values.kcache.maxBodyBytes | int64 }}
            {{- if .Values.kcache.tls.caSecretName }}
            - -tls-ca-dir=/etc/kcache/tls
            {{- end }}
            {{- if .Values.kcache.ifacePattern }}
            - -iface-pattern={{ .Values.kcache.ifacePattern }}
            {{- end }}
            {{- if .Values.kcache.logFile }}
            - -log-file=/var/log/kcache/{{ .Values.kcache.logFile }}
            {{- end }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          {{- if or .Values.kcache.tls.caSecretName .Values.kcache.logFile }}
          volumeMounts:
            {{- if .Values.kcache.tls.caSecretName }}
            - name: tls-ca
              mountPath: /etc/kcache/tls
              readOnly: true
            {{- end }}
            {{- if .Values.kcache.logFile }}
            - name: log-dir
              mountPath: /var/log/kcache
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.kcache.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.kcache.resources | nindent 12 }}
      {{- if or .Values.kcache.tls.caSecretName .Values.kcache.logFile }}
      volumes:
        {{- if .Values.kcache.tls.caSecretName }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.kcache.tls.caSecretName }}
        {{- end }}
        {{- if .Values.kcache.logFile }}
        - name: log-dir
          hostPath:
            path: /var/log/kcache
            type: DirectoryOrCreate
        {{- end }}
      {{- end }}
{{- end }}
