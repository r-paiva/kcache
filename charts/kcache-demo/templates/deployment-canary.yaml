{{- if .Values.canary.enabled }}
{{- $svcName := printf "%s-backend" (include "kcache-demo.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kcache-demo.fullname" . }}-canary
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kcache-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: canary
  template:
    metadata:
      labels:
        {{- include "kcache-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: canary
    spec:
      nodeSelector:
        kubernetes.io/hostname: paiva-desktop
      containers:
        - name: canary
          image: "{{ .Values.canary.image.repository }}:{{ .Values.canary.image.tag }}"
          imagePullPolicy: {{ .Values.canary.image.pullPolicy }}
          env:
            - name: HTTP_BASE
              value: "http://{{ $svcName }}"
            - name: HTTPS_BASE
              value: "https://{{ $svcName }}"
            - name: INTERVAL
              value: {{ .Values.canary.interval | quote }}
            - name: JITTER
              value: {{ .Values.canary.jitter | quote }}
            {{- if .Values.kcache.tls.caSecretName }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/kcache-ca.crt
            {{- end }}
            {{- if .Values.canary.debug }}
            - name: DEBUG
              value: "1"
            {{- end }}
          {{- if .Values.kcache.tls.caSecretName }}
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/ssl/kcache-ca.crt
              subPath: tls.crt
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.canary.resources | nindent 12 }}
      {{- if .Values.kcache.tls.caSecretName }}
      volumes:
        - name: ca-cert
          secret:
            secretName: {{ .Values.kcache.tls.caSecretName }}
      {{- end }}
{{- end }}
