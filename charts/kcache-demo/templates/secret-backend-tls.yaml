{{- if .Values.backend.tls.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.backend.tls.secretName }}
{{- if not $existing }}
{{- $svcName := printf "%s-backend" (include "kcache-demo.fullname" .) }}
{{- $cert := genSelfSignedCert $svcName nil (list $svcName) 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.tls.secretName }}
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
