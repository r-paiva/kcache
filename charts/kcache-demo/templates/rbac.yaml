apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kcache-demo.fullname" . }}-kcache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kcache-demo.fullname" . }}-kcache
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
rules:
  # Watch CachePolicy CRDs across all namespaces.
  - apiGroups: ["kcache.io"]
    resources: ["cachepolicies"]
    verbs: ["get", "list", "watch"]
  # Watch pods to map source IPs to namespaces and labels.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kcache-demo.fullname" . }}-kcache
  labels:
    {{- include "kcache-demo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kcache-demo.fullname" . }}-kcache
subjects:
  - kind: ServiceAccount
    name: {{ include "kcache-demo.fullname" . }}-kcache
    namespace: {{ .Release.Namespace }}
