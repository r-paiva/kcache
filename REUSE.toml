version = 1

# bpf2go regenerates these Go bindings from bpf/latch.c on every `go generate`,
# stripping any injected SPDX header. Declare their licensing here instead so
# REUSE compliance survives regeneration.
[[annotations]]
path = ["bpf/latch_bpfeb.go", "bpf/latch_bpfel.go"]
SPDX-FileCopyrightText = "The latch Contributors"
SPDX-License-Identifier = "Apache-2.0"
