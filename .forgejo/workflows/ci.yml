"on":
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true
            - run: go generate ./...
            - run: go vet ./...
            - run: go test ./...

    reuse:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            - run: pip install reuse --quiet && reuse lint
