on:
  workflow_dispatch:

jobs:
  test:
    runs-on: codeberg-tiny-lazy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./internal/...
      - run: go test ./internal/...

  reuse:
    runs-on: codeberg-tiny-lazy
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user --break-system-packages reuse
      - run: ~/.local/bin/reuse lint
