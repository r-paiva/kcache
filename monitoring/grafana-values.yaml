adminPassword: kcache

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

persistence:
  enabled: false

# Wire up Prometheus as the default datasource automatically.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        access: proxy

# Tell Grafana to look for dashboards in a mounted folder.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kcache
        orgId: 1
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kcache

# Provision the kcache dashboard inline — no manual import needed.
dashboards:
  kcache:
    overview:
      json: |
        {
          "title": "kcache",
          "uid": "kcache-overview",
          "schemaVersion": 38,
          "version": 1,
          "refresh": "10s",
          "time": { "from": "now-30m", "to": "now" },
          "graphTooltip": 1,
          "tags": ["kcache"],
          "panels": [
            {
              "id": 1, "type": "stat", "title": "Hit Rate",
              "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "value", "graphMode": "area",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red",    "value": null },
                      { "color": "yellow", "value": 50 },
                      { "color": "green",  "value": 80 }
                    ]
                  }
                }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(kcache_requests_total{cache=\"hit\"}[$__rate_interval])) / sum(rate(kcache_requests_total{cache=~\"hit|miss\"}[$__rate_interval])) * 100",
                "legendFormat": "hit rate"
              }]
            },
            {
              "id": 2, "type": "stat", "title": "Requests / sec",
              "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "background", "graphMode": "area",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": { "unit": "reqps", "color": { "mode": "fixed", "fixedColor": "blue" } }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(kcache_requests_total[$__rate_interval]))",
                "legendFormat": "req/s"
              }]
            },
            {
              "id": 3, "type": "stat", "title": "BPF Redirects / sec",
              "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "background", "graphMode": "area",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": { "unit": "reqps", "color": { "mode": "fixed", "fixedColor": "purple" } }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(kcache_bpf_redirects_total[$__rate_interval]))",
                "legendFormat": "redirects/s"
              }]
            },
            {
              "id": 4, "type": "stat", "title": "Cache Entries",
              "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "value", "graphMode": "none",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green",  "value": null },
                      { "color": "yellow", "value": 8000 },
                      { "color": "red",    "value": 9500 }
                    ]
                  }
                }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(kcache_cache_entries_total)",
                "legendFormat": "entries"
              }]
            },
            {
              "id": 5, "type": "stat", "title": "Cache Size",
              "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "value", "graphMode": "none",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": { "unit": "bytes", "color": { "mode": "fixed", "fixedColor": "text" } }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(kcache_cache_size_bytes)",
                "legendFormat": "bytes"
              }]
            },
            {
              "id": 6, "type": "stat", "title": "Evictions / sec",
              "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
              "options": {
                "reduceOptions": { "calcs": ["lastNotNull"] },
                "colorMode": "value", "graphMode": "area",
                "orientation": "auto", "textMode": "auto"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green",  "value": null },
                      { "color": "yellow", "value": 1 },
                      { "color": "red",    "value": 10 }
                    ]
                  }
                }
              },
              "targets": [{
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(kcache_cache_evictions_total[$__rate_interval]))",
                "legendFormat": "evictions/s"
              }]
            },
            {
              "id": 7, "type": "timeseries", "title": "Requests by Result",
              "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "custom": { "lineWidth": 2, "fillOpacity": 8, "stacking": { "mode": "none" } }
                },
                "overrides": [
                  { "matcher": { "id": "byName", "options": "hit"    }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green"  }}]},
                  { "matcher": { "id": "byName", "options": "miss"   }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" }}]},
                  { "matcher": { "id": "byName", "options": "bypass" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue"   }}]},
                  { "matcher": { "id": "byName", "options": "error"  }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red"    }}]}
                ]
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(kcache_requests_total{cache=\"hit\"}[$__rate_interval]))",
                  "legendFormat": "hit"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(kcache_requests_total{cache=\"miss\"}[$__rate_interval]))",
                  "legendFormat": "miss"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(kcache_requests_total{cache=\"bypass\"}[$__rate_interval]))",
                  "legendFormat": "bypass"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(rate(kcache_requests_total{cache=\"error\"}[$__rate_interval]))",
                  "legendFormat": "error"
                }
              ]
            },
            {
              "id": 8, "type": "timeseries", "title": "Hit Latency",
              "description": "Time to serve a response from cache.",
              "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": { "lineWidth": 2, "fillOpacity": 5 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(kcache_hit_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p50"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(kcache_hit_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p95"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(kcache_hit_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 9, "type": "timeseries", "title": "Upstream Latency",
              "description": "Time to fetch a response from the real backend on a cache miss.",
              "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": { "lineWidth": 2, "fillOpacity": 5 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(kcache_upstream_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p50"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(kcache_upstream_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p95"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(kcache_upstream_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 10, "type": "timeseries", "title": "Cache Size Over Time",
              "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "single", "sort": "none" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "custom": { "lineWidth": 1, "fillOpacity": 15 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(kcache_cache_size_bytes)",
                  "legendFormat": "cache bytes"
                }
              ]
            },
            {
              "id": 11, "type": "timeseries", "title": "Requests by Host",
              "description": "Total request rate broken down by upstream host.",
              "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "custom": { "lineWidth": 2, "fillOpacity": 8 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (host) (rate(kcache_requests_total[$__rate_interval]))",
                  "legendFormat": "{{host}}"
                }
              ]
            },
            {
              "id": 12, "type": "timeseries", "title": "Hit Rate by Host",
              "description": "Cache hit rate (hits / cacheable requests) per upstream host.",
              "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0, "max": 100,
                  "custom": { "lineWidth": 2, "fillOpacity": 8 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (host) (rate(kcache_requests_total{cache=\"hit\"}[$__rate_interval])) / sum by (host) (rate(kcache_requests_total{cache=~\"hit|miss\"}[$__rate_interval])) * 100",
                  "legendFormat": "{{host}}"
                }
              ]
            },
            {
              "id": 13, "type": "timeseries", "title": "Requests by Path",
              "description": "Request rate per URL path. Shows which endpoints are most active.",
              "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "custom": { "lineWidth": 2, "fillOpacity": 8 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (path) (rate(kcache_requests_total[$__rate_interval]))",
                  "legendFormat": "{{path}}"
                }
              ]
            },
            {
              "id": 14, "type": "timeseries", "title": "Cache Result by Path",
              "description": "Hit vs miss rate per URL path. Reveals which endpoints benefit most from caching.",
              "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "custom": { "lineWidth": 2, "fillOpacity": 8 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (path) (rate(kcache_requests_total{cache=\"hit\"}[$__rate_interval]))",
                  "legendFormat": "hit {{path}}"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (path) (rate(kcache_requests_total{cache=\"miss\"}[$__rate_interval]))",
                  "legendFormat": "miss {{path}}"
                }
              ]
            },
            {
              "id": 15, "type": "timeseries", "title": "Upstream Latency by Path",
              "description": "p95 latency to the real backend, per path. Only populated on cache misses.",
              "gridPos": { "x": 0, "y": 36, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": { "lineWidth": 2, "fillOpacity": 5 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.95, sum by (path, le) (rate(kcache_upstream_latency_seconds_bucket[$__rate_interval])))",
                  "legendFormat": "p95 {{path}}"
                }
              ]
            },
            {
              "id": 16, "type": "timeseries", "title": "Response Size by Path",
              "description": "p50 response body size per path. Useful for identifying large cacheable payloads.",
              "gridPos": { "x": 12, "y": 36, "w": 12, "h": 8 },
              "options": {
                "tooltip": { "mode": "multi", "sort": "desc" },
                "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "custom": { "lineWidth": 2, "fillOpacity": 5 }
                }
              },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "histogram_quantile(0.50, sum by (path, le) (rate(kcache_response_size_bytes_bucket[$__rate_interval])))",
                  "legendFormat": "p50 {{path}}"
                }
              ]
            }
          ]
        }
