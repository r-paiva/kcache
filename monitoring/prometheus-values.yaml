# Minimal Prometheus install — server only, no alertmanager/pushgateway/exporters

alertmanager:
    enabled: false

prometheus-pushgateway:
    enabled: false

kube-state-metrics:
    enabled: false

prometheus-node-exporter:
    enabled: false

server:
    persistentVolume:
        enabled: false

    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            memory: 512Mi

    retention: 6h

    global:
        scrape_interval: 10s
        evaluation_interval: 10s

extraScrapeConfigs: |
    - job_name: kcache
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [default]
      relabel_configs:
        # Keep only kcache component pods.
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          action: keep
          regex: kcache
        # Use the pod IP + metrics port as the scrape target.
        - source_labels: [__meta_kubernetes_pod_ip]
          target_label: __address__
          replacement: $1:9090
        # Carry pod name and namespace as labels on every metric.
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
